services:
  ocr-service:
    build: ./ocr-service
    container_name: ocr-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      PREPROCESS_ENABLED: "true"
      PREPROCESS_MAX_SIZE: "4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    container_name: ocr-order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocr_orders
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d ocr_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  laravel-app:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: laravel-app
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ocr-service:
        condition: service_started
    environment:
      # Local dev only key — this is NOT the production APP_KEY.
      APP_KEY: base64:UR3+Y70iNg3jyE5kDoI4THJYNs84Bf7JmDTXa4gPVMw=
      APP_ENV: local
      APP_DEBUG: "true"
      OCR_SERVICE_URL: http://ocr-service:8000
      OCR_SERVICE_TIMEOUT: "300"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ocr_orders
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - ./laravel-app:/var/www/html

volumes:
  postgres-data: